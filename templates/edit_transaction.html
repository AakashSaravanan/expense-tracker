
{% extends "base.html" %}

{% block title %}Edit Transaction - Expense Tracker{% endblock %}

{% block content %}

<div class="row justify-content-center mt-3">

    <div class="col-md-7 col-lg-6">

        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h2 class="mb-4">Edit Transaction</h2>

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">Amount</label>

                        <input
                            type="number"
                            name="amount"
                            step="0.01"
                            value="{{ transaction.amount }}"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Date</label>

                        <input
                            type="date"
                            name="date"
                            value="{{ transaction.date.strftime('%Y-%m-%d') }}"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Type</label>

                        <select name="type" class="form-select" required>

                            <option value="expense"
                                {% if transaction.type == "expense" %}selected{% endif %}>
                                Expense
                            </option>

                            <option value="income"
                                {% if transaction.type == "income" %}selected{% endif %}>
                                Income
                            </option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Category</label>

                        <select name="category_id" class="form-select" required>

                            {% for category in categories %}

                                <option
                                    value="{{ category.category_id }}"
                                    {% if category.category_id == transaction.category_id %}
                                        selected
                                    {% endif %}
                                >
                                    {{ category.category_name }}
                                </option>

                            {% endfor %}

                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="3"
                        >{{ transaction.description or '' }}</textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Save Changes
                    </button>

                    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
                        Cancel
                    </a>

                </form>

            </div>
        </div>

    </div>

</div>

{% endblock %}
