<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Transaction</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container mt-5">

    <h1>{{ "Edit Transaction" if transaction else "Add Transaction" }}</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST"
      action="{% if transaction %}{{ url_for('transaction_routes.edit_transaction', transaction_id=transaction.transaction_id) }}{% else %}{{ url_for('transaction_routes.add_transaction') }}{% endif %}"
      enctype="multipart/form-data">

        <div class="mb-3">
            <label class="form-label">Amount</label>

            <input type="number" name="amount" step="0.01"
                class="form-control"
                value="{{ transaction.amount if transaction else '' }}"
                required>
        </div>


        <div class="mb-3">

            <label class="form-label">Date</label>

            <input type="date" name="date" class="form-control"
                value="{{ transaction.date.isoformat() if transaction else '' }}"
                required>
        </div>


        <div class="mb-3">

            <label class="form-label">Type</label>

            <select name="type" class="form-select" required>
                <option value="expense"
                    {% if transaction and transaction.type == 'expense' %}selected{% endif %}>
                    Expense
                </option>
                <option value="income"
                    {% if transaction and transaction.type == 'income' %}selected{% endif %}>
                    Income
                </option>
            </select>

        </div>


        <div class="mb-3">

            <label class="form-label">Category</label>

            <select name="category_id" class="form-select" required>

                {% for category in categories %}

                    <option value="{{ category.category_id }}">
                        {{ category.category_name }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <div class="mb-3">

            <label class="form-label">Description</label>

            <textarea name="description" class="form-control" rows="3">{{ transaction.description if transaction and transaction.description else '' }}</textarea>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Receipt
            </label>

            <input
                type="file"
                name="receipt"
                class="form-control"
                accept="image/*,.pdf"
            >

        </div>


        <button type="submit" class="btn btn-primary">
            {{ "Save Changes" if transaction else "Add Transaction" }}
        </button>

        <a href="/dashboard" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

</body>

</html>
